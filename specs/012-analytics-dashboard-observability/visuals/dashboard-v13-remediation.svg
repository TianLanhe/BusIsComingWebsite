<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183c43" flood-opacity=".11"/>
    </filter>
    <style>
      .bg{fill:#f4f8f8}.surface{fill:#fff;stroke:#d7e5e7;stroke-width:2}.soft{fill:#edf8f7}
      .nav{fill:#103c42}.navActive{fill:#20565c}.teal{fill:#0b7377}.amber{fill:#d98a14}.purple{fill:#8b5cf6}.blue{fill:#2799a8}.red{fill:#c74e48}.green{fill:#16865f}
      .text{fill:#173b42;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#657b80;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:30px;font-weight:800}.h2{font-size:22px;font-weight:780}.label{font-size:17px;font-weight:700}.body{font-size:16px;font-weight:520}.tiny{font-size:14px;font-weight:600}.metric{font-size:31px;font-weight:820}
