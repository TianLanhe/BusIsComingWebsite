openapi: 3.1.0
info:
  title: BusIsComing Android 安装包 API
  version: '2026-07-21'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    网站主页读取当前 Android APK 元数据和下载当前 APK 的公开契约。
    元数据用于主页 Android 下载入口的可用性门禁和展示；只有取得合法的可用元数据后，前端才可开放稳定下载链接。
    元数据成功只表示检查时入口可用，不保证后续独立的 APK 下载请求或浏览器落盘最终完成；任何响应都不得暴露内部路径或构建来源。
servers:
  - url: /
    description: 网站同源公开后端
tags:
  - name: Android 安装包
    description: 当前 Android APK 元数据与下载
paths:
  /api/downloads/android/latest/metadata:
    get:
      tags:
        - Android 安装包
      operationId: getLatestAndroidApkMetadata
      summary: 查询当前 Android APK 元数据
      description: |
        返回主页展示当前 APK 版本和大小所需的白名单字段，不读取或返回 APK bytes。
        前端仅在收到合法且状态为 available 的元数据时，使用其中稳定下载地址和文件名开放 Android 下载入口；
        元数据请求失败或字段无效时，入口应保持不可操作。元数据成功不代表后续独立 APK 下载请求或浏览器落盘必然完成。
        请求不包含 visitor ID path、query 或 body；普通非机器人浏览器的匿名标识由
        HttpOnly Cookie 自动携带或由服务端签发。

        当 `X-BusIsComing-Home-Locale` 是合法主页枚举时，本次到达请求会产生一条
        `page_view` 明细；元数据读取失败仍记录该主页访问。统计写入失败不改变本接口响应。
      security: []
      parameters:
        - $ref: '#/components/parameters/HomeLocaleHeader'
        - $ref: '#/components/parameters/TrafficSourceHeader'
      x-authentication:
        required: false
        reason: 公开主页元数据接口不需要账号、API key 或 bearer token
      x-cache-policy:
        responseHeader: Cache-Control
        value: no-store
        reason: 当前版本和不可用状态都不能被长期缓存
      x-anonymous-analytics:
        eventType: page_view
        visitorTransport: __Host-bic-visitor HttpOnly Cookie
        botBehavior: 已知机器人不签发 Cookie，也不保存统计明细
        forbiddenStorage:
          - IP
          - 完整 User-Agent
          - 完整 Referrer
          - 完整 Cookie
          - 请求 URL 或 query
      responses:
        '200':
          description: 当前 Android APK 元数据可用
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestApkMetadata'
              examples:
                available:
                  summary: 当前 APK 可用
                  value:
                    platform: android
                    status: available
                    versionName: '1.0'
                    versionCode: 1
                    fileName: BusIsComing.apk
                    sizeBytes: 5563930
                    lastUpdated: '2026-07-07'
                    downloadUrl: /api/downloads/android/latest
        '404':
          description: 当前 APK 元数据不存在
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataError'
              examples:
                missing:
                  summary: 当前元数据不存在
                  value:
                    code: APK_METADATA_MISSING
                    message: 当前 Android APK 版本信息暂时不可用。
        '500':
          description: 当前 APK 元数据无法读取或校验
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataError'
              examples:
                invalid:
                  summary: 元数据格式无效
                  value:
                    code: APK_METADATA_INVALID
                    message: 当前 Android APK 版本信息暂时不可用。
                internal:
                  summary: 服务端内部错误
                  value:
                    code: DOWNLOAD_INTERNAL_ERROR
                    message: 当前 Android APK 版本信息暂时不可用。
  /api/downloads/android/latest:
    get:
      tags:
        - Android 安装包
      operationId: downloadLatestAndroidApk
      summary: 下载当前 BusIsComing Android APK
      description: |
        无业务请求参数的公开稳定下载地址。成功时返回当前唯一 Android APK；缺失、不可读或
        完整性不匹配时返回 JSON 错误，绝不返回部分 APK。

        visitor ID 只由 HttpOnly Cookie 自动携带，不进入 path、query 或 body。普通非机器人
        请求产生 `download_request` 明细；成功归因使用本次实际响应的版本和大小，失败时版本
        可以为空。该指标只表示下载请求/成功响应，不表示安装完成。
      security: []
      parameters:
        - $ref: '#/components/parameters/TrafficSourceHeader'
      x-authentication:
        required: false
        reason: 公开 APK 下载接口不要求登录
      x-cache-policy:
        responseHeader: Cache-Control
        value: no-store
        reason: 稳定 latest 地址不能返回替换前的 APK 或陈旧错误
      x-anonymous-analytics:
        eventType: download_request
        visitorTransport: __Host-bic-visitor HttpOnly Cookie
        platform: android
        successAttribution: 使用本次实际响应的 versionName、versionCode 和 sizeBytes
        installationClaim: false
      responses:
        '200':
          description: 当前 Android APK 文件
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
            Content-Disposition:
              description: APK 附件文件名
              schema:
                type: string
                example: attachment; filename="BusIsComing.apk"
            Content-Length:
              description: 实际响应 APK 的字节大小
              schema:
                type: integer
                minimum: 1
                example: 5563930
            X-APK-SHA256:
              description: 实际响应 APK 的 SHA-256
              schema:
                type: string
                pattern: ^[a-f0-9]{64}$
            X-APK-Version-Name:
              description: 实际响应 APK 的 Android versionName
              schema:
                type: string
                example: '1.0'
            X-APK-Version-Code:
              description: 实际响应 APK 的 Android versionCode
              schema:
                type: string
                example: '1'
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: 当前 APK 不存在
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadError'
              examples:
                missing:
                  summary: 当前 APK 不存在
                  value:
                    code: APK_MISSING
                    message: 当前 Android APK 暂时不可用。
                    expectedSha256: null
                    actualSha256: null
                    expectedSizeBytes: 5563930
                    actualSizeBytes: null
        '409':
          description: 当前 APK 与记录的大小或校验值不一致
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadError'
              examples:
                mismatch:
                  summary: APK 完整性不匹配
                  value:
                    code: APK_CHECKSUM_MISMATCH
                    message: 当前 Android APK 与记录的元数据不一致。
                    expectedSha256: null
                    actualSha256: null
                    expectedSizeBytes: 5563930
                    actualSizeBytes: 5563900
        '500':
          description: 当前 APK 无法读取或下载服务发生内部错误
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/AnonymousVisitorCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadError'
              examples:
                unreadable:
                  summary: APK 无法读取
                  value:
                    code: APK_UNREADABLE
                    message: 当前 Android APK 无法读取。
                    expectedSha256: null
                    actualSha256: null
                    expectedSizeBytes: 5563930
                    actualSizeBytes: null
                internal:
                  summary: 下载服务内部错误
                  value:
                    code: DOWNLOAD_INTERNAL_ERROR
                    message: Android APK 下载服务暂时不可用。
components:
  parameters:
    HomeLocaleHeader:
      name: X-BusIsComing-Home-Locale
      in: header
      required: false
      description: |
        主页前端在精确的 `/zh-hant/`、`/zh-hans/`、`/en/` document 中发送的有限枚举。
        该 header 只用于确认主页访问和语言分类，不是 APK 业务字段；缺失或非法值不产生
        `page_view`，但不影响元数据业务响应。
      schema:
        type: string
        enum:
          - zh-Hant
          - zh-Hans
          - en
      example: zh-Hant
    TrafficSourceHeader:
      name: X-BusIsComing-Traffic-Source
      in: header
      required: false
      description: |
        前端在浏览器内从 `document.referrer` 瞬时归类后的粗粒度来源。不得发送原始 URL；
        缺失或非法值由服务端安全归为 `unknown` 或通过同会话主页事件派生。
      schema:
        type: string
        enum:
          - direct
          - search
          - referral
          - internal
          - unknown
      example: search
  headers:
    NoStore:
      description: 禁止缓存当前版本、APK bytes 或错误状态
      schema:
        type: string
        const: no-store
        example: no-store
    AnonymousVisitorCookie:
      description: |
        普通非机器人请求可能签发或轮换 `__Host-bic-visitor`。属性固定为 HttpOnly、Secure、
        SameSite=Lax、Path=/、host-only、一年有效期；已知机器人不会收到该 header。
      schema:
        type: string
  schemas:
    LatestApkMetadata:
      type: object
      required:
        - platform
        - status
        - versionName
        - versionCode
        - fileName
        - sizeBytes
        - lastUpdated
        - downloadUrl
      properties:
        platform:
          type: string
          const: android
          description: 当前正式安装包平台
        status:
          type: string
          const: available
          description: 当前 APK 元数据可用
        versionName:
          type: string
          minLength: 1
          maxLength: 64
          description: Android versionName
        versionCode:
          type: integer
          minimum: 1
          description: Android versionCode
        fileName:
          type: string
          minLength: 1
          pattern: ^[^/\\]+$
          description: 只含 basename 的 APK 文件名
        sizeBytes:
          type: integer
          minimum: 1
          description: APK 字节大小；前端按当前语言格式化
        lastUpdated:
          type: string
          format: date
          description: 当前 manifest 的更新时间
        downloadUrl:
          type: string
          const: /api/downloads/android/latest
          description: 不随版本变化的稳定下载地址
      additionalProperties: false
    MetadataError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - APK_METADATA_MISSING
            - APK_METADATA_UNREADABLE
            - APK_METADATA_INVALID
            - DOWNLOAD_INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          description: 可安全返回浏览器的简体中文调试说明；前端使用自有三语文案
      additionalProperties: false
    DownloadError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - APK_MISSING
            - APK_UNREADABLE
            - APK_CHECKSUM_MISMATCH
            - DOWNLOAD_INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          description: 可安全返回浏览器的调试说明；前端不得直接作为用户文案
        expectedSha256:
          type:
            - string
            - 'null'
          pattern: ^[a-f0-9]{64}$
        actualSha256:
          type:
            - string
            - 'null'
          pattern: ^[a-f0-9]{64}$
        expectedSizeBytes:
          type:
            - integer
            - 'null'
          minimum: 1
        actualSizeBytes:
          type:
            - integer
            - 'null'
          minimum: 0
      additionalProperties: false
x-contract-locations:
  feature: specs/010-website-analytics/contracts/download-api.openapi.yaml
  sharedPrimary: shared/contracts/openapi/download-api.openapi.yaml
  sharedCompatibility: shared/contracts/download-api.openapi.yaml
