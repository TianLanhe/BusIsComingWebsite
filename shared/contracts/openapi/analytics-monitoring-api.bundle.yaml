    TrafficSeriesPoint:
      type: object
      required:
        - bucketStart
        - bucketEnd
        - pv
        - uv
        - successfulPlaceVisitors
        - successfulRouteVisitors
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketEnd:
          type: string
          format: date-time
        pv:
          type: integer
          minimum: 0
        uv:
          type: integer
          minimum: 0
        successfulPlaceVisitors:
          type: integer
          minimum: 0
        successfulRouteVisitors:
          type: integer
          minimum: 0
      additionalProperties: false
    DownloadSeriesPoint:
      type: object
      required:
        - bucketStart
        - bucketEnd
        - requests
        - successfulResponses
        - uv
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketEnd:
          type: string
          format: date-time
        requests:
          type: integer
          minimum: 0
        successfulResponses:
          type: integer
          minimum: 0
        uv:
          type: integer
          minimum: 0
      additionalProperties: false
    FunnelStage:
      type: object
      required:
        - key
        - uniqueVisitors
        - fromPreviousRate
        - fromFirstRate
      properties:
        key:
          type: string
          enum:
            - homepage
            - successful_place_query
            - successful_route_query
            - successful_download_response
        uniqueVisitors:
          type: integer
          minimum: 0
        fromPreviousRate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        fromFirstRate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
      additionalProperties: false
    Funnel:
      type: object
      required:
        - key
        - sessionGapMinutes
        - stages
      properties:
        key:
          type: string
          enum:
            - trial
            - download
        sessionGapMinutes:
          type: integer
          const: 30
        stages:
          type: array
          minItems: 2
          maxItems: 3
          items:
            $ref: '#/components/schemas/FunnelStage'
      additionalProperties: false
    DistributionPoint:
      type: object
      required:
        - key
        - count
        - ratio
      properties:
        key:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
        ratio:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
      additionalProperties: false
    LatencySummary:
      type: object
      required:
        - requestCount
        - p50Ms
        - p95Ms
      properties:
        requestCount:
          type: integer
          minimum: 0
        p50Ms:
          type:
            - integer
            - 'null'
          minimum: 0
        p95Ms:
          type:
            - integer
            - 'null'
          minimum: 0
      additionalProperties: false
    HeatmapCell:
      type: object
      description: 011 私有契约的逐日热力图单元，直接替换旧 weekday/hour item schema；不提供旧结构兼容
      required:
        - localDate
        - bucketStart
        - bucketEnd
        - eventCount
        - uv
      properties:
        localDate:
          type: string
          format: date
          description: 香港当地日期；在同一查询响应中唯一并按升序排列
          example: '2026-07-23'
        bucketStart:
          type: string
          format: date-time
          description: 当日香港 00:00，包含
          example: '2026-07-23T00:00:00+08:00'
        bucketEnd:
          type: string
          format: date-time
          description: 下一日香港 00:00 或本次查询结束时刻，不包含
          example: '2026-07-23T09:16:42+08:00'
        eventCount:
          type: integer
          minimum: 0
          description: 当日通过筛选的匿名事件总数
        uv:
          type: integer
          minimum: 0
          description: 当日不同匿名浏览器标识数量
      additionalProperties: false
    EventLatencySummary:
      type: object
      required:
        - eventType
        - requestCount
        - p95Ms
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        requestCount:
          type: integer
          minimum: 0
          description: 当前范围内该事件类型的成功请求样本数
        p95Ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 成功样本最近秩 P95；没有成功样本时为空，不得以 0 替代
      additionalProperties: false
    OverviewData:
      type: object
      required:
        - meta
        - metrics
        - trafficSeries
        - trialFunnel
        - downloadFunnel
        - eventComposition
        - latency
        - latencyByEvent
        - downloadPlatforms
        - downloadVersions
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        trafficSeries:
          type: array
          items:
            $ref: '#/components/schemas/TrafficSeriesPoint'
        trialFunnel:
          $ref: '#/components/schemas/Funnel'
        downloadFunnel:
          $ref: '#/components/schemas/Funnel'
        eventComposition:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
        latency:
          $ref: '#/components/schemas/LatencySummary'
        latencyByEvent:
          type: array
          minItems: 4
          maxItems: 4
          description: 按 APK 元数据、地点查询、路线查询、下载响应稳定顺序返回的成功请求 P95
          items:
            $ref: '#/components/schemas/EventLatencySummary'
        downloadPlatforms:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
        downloadVersions:
          type: array
          items:
            $ref: '#/components/schemas/VersionDistribution'
      additionalProperties: false
    TrafficData:
      type: object
      required:
        - meta
        - metrics
        - series
        - trialFunnel
        - heatmap
        - locales
        - devices
        - sources
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        metrics:
          type: array
          description: |
            至少包含 `pv`、`uv`、`placeQueryRequests`、`placeQueryVisitors`、
            `routeQueryRequests`、`routeQueryVisitors` 六个稳定 key；地点和路线请求数包含成功
            与失败。既有成功试查 Visitor key 继续保留。
          items:
            $ref: '#/components/schemas/Metric'
        series:
          type: array
          items:
            $ref: '#/components/schemas/TrafficSeriesPoint'
        trialFunnel:
          $ref: '#/components/schemas/Funnel'
        heatmap:
          type: array
          description: 逐日热力图；011 与旧 weekday/hour item schema 不兼容，调用方必须与服务端原子升级
          items:
            $ref: '#/components/schemas/HeatmapCell'
        locales:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
      additionalProperties: false
    VersionDistribution:
      type: object
      required:
        - platform
        - versionName
        - versionCode
        - requestCount
        - successfulResponses
        - uv
        - sizeBytes
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        versionName:
          type: string
          minLength: 1
        versionCode:
          type: integer
          minimum: 1
        requestCount:
          type: integer
          minimum: 0
        successfulResponses:
          type: integer
          minimum: 0
        uv:
          type: integer
          minimum: 0
        sizeBytes:
          type: integer
          minimum: 1
      additionalProperties: false
    DownloadsData:
      type: object
      required:
        - meta
        - metrics
        - series
        - downloadFunnel
        - platforms
        - versions
        - failures
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        series:
          type: array
          items:
            $ref: '#/components/schemas/DownloadSeriesPoint'
        downloadFunnel:
          $ref: '#/components/schemas/Funnel'
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionDistribution'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
      additionalProperties: false
    DownloadAttribution:
      type: object
      required:
        - platform
        - versionName
        - versionCode
        - sizeBytes
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        versionName:
          type:
            - string
            - 'null'
          maxLength: 64
        versionCode:
          type:
            - integer
            - 'null'
          minimum: 1
        sizeBytes:
          type:
            - integer
            - 'null'
          minimum: 1
      additionalProperties: false
    EventDetail:
      type: object
      required:
        - eventId
        - occurredAt
        - visitorId
        - eventType
        - outcome
        - httpStatus
        - statusClass
        - failureCategory
        - durationMs
        - locale
        - deviceType
        - sourceType
        - download
      properties:
        eventId:
          type: string
          pattern: ^[0-9]+$
        occurredAt:
          type: string
          format: date-time
        visitorId:
          $ref: '#/components/schemas/VisitorId'
        eventType:
          $ref: '#/components/schemas/EventType'
        outcome:
          $ref: '#/components/schemas/Outcome'
        httpStatus:
          type:
            - integer
            - 'null'
          minimum: 100
          maximum: 599
        statusClass:
          $ref: '#/components/schemas/StatusClass'
        failureCategory:
          oneOf:
            - $ref: '#/components/schemas/FailureCategory'
            - type: 'null'
        durationMs:
          type: integer
          minimum: 0
        locale:
          $ref: '#/components/schemas/Locale'
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        download:
          oneOf:
            - $ref: '#/components/schemas/DownloadAttribution'
            - type: 'null'
      additionalProperties: false
    PageInfo:
      type: object
      required:
        - limit
        - nextCursor
        - hasMore
        - totalCount
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type:
            - string
            - 'null'
        hasMore:
          type: boolean
        totalCount:
          type: integer
          minimum: 0
      additionalProperties: false
    EventRangeSummary:
      type: object
      required:
        - totalCount
        - successCount
        - failureCount
        - uniqueVisitors
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: 完整筛选范围事件总数
        successCount:
          type: integer
          minimum: 0
          description: 完整筛选范围成功事件数
        failureCount:
          type: integer
          minimum: 0
          description: 完整筛选范围失败事件数
        uniqueVisitors:
          type: integer
          minimum: 0
          description: 完整筛选范围独立匿名浏览器数
      additionalProperties: false
    EventListData:
      type: object
      required:
        - meta
        - summary
        - summaryMetrics
        - items
        - pageInfo
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        summary:
          $ref: '#/components/schemas/EventRangeSummary'
        summaryMetrics:
          type: array
          minItems: 4
          maxItems: 4
          description: |
            按 `totalCount`、`successCount`、`failureCount`、`uniqueVisitors` 稳定顺序
            返回的完整筛选范围同期指标；当前值分别等于 `summary` 中对应值。
          items:
            $ref: '#/components/schemas/Metric'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDetail'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      additionalProperties: false
    VisitorSummary:
      type: object
      required:
        - visitorId
        - firstSeenAt
        - lastSeenAt
        - eventCount
        - sessionCount
        - commonLocale
        - commonDeviceType
        - commonSourceType
        - eventComposition
        - commonPlatform
      properties:
        visitorId:
          $ref: '#/components/schemas/VisitorId'
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        eventCount:
          type: integer
          minimum: 1
        sessionCount:
          type: integer
          minimum: 1
        commonLocale:
          $ref: '#/components/schemas/Locale'
          description: 完整访客历史中按出现次数和稳定并列规则派生的常见语言
        commonDeviceType:
          $ref: '#/components/schemas/DeviceType'
          description: 完整访客历史中按出现次数和稳定并列规则派生的常见装置
        commonSourceType:
          $ref: '#/components/schemas/SourceType'
        eventComposition:
          type: array
          description: 该匿名标识完整保留历史中的事件类型分布
          items:
            $ref: '#/components/schemas/DistributionPoint'
        commonPlatform:
          oneOf:
            - $ref: '#/components/schemas/Platform'
            - type: 'null'
          description: 只从下载事件归因计算；没有有效下载平台时为空
      additionalProperties: false
    DerivedSession:
      type: object
      required:
        - ordinal
        - startedAt
        - endedAt
        - durationMs
        - eventCount
        - events
      properties:
        ordinal:
          type: integer
          minimum: 1
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        eventCount:
          type: integer
          minimum: 1
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventDetail'
      additionalProperties: false
    VisitorData:
      type: object
      required:
        - generatedAt
        - timezone
        - visitor
        - sessions
        - pageInfo
      properties:
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
          const: Asia/Hong_Kong
        visitor:
          $ref: '#/components/schemas/VisitorSummary'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DerivedSession'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      additionalProperties: false
    PercentileComparison:
      type: object
      required:
        - currentMs
        - previousMs
        - deltaMs
        - deltaRate
      description: |
        单个时延分位的当前与上一等长周期比较。上一周期为 0 时 `deltaMs` 有值、
        `deltaRate` 为空；比较关闭或任一侧无样本时不适用字段为空。
      properties:
        currentMs:
          type:
            - integer
            - 'null'
          minimum: 0
        previousMs:
          type:
            - integer
            - 'null'
          minimum: 0
        deltaMs:
          type:
            - integer
            - 'null'
          description: 当前值减上一周期值
        deltaRate:
          type:
            - number
            - 'null'
      additionalProperties: false
    EndpointPerformance:
      type: object
      required:
        - operationId
        - eventType
        - requestCount
        - successRate
        - p50Ms
        - p50Comparison
        - p95Ms
        - p95Comparison
      properties:
        operationId:
          type: string
          enum:
            - getLatestAndroidApkMetadata
            - queryRoutePlaces
            - queryRouteOptions
            - downloadLatestAndroidApk
        eventType:
          $ref: '#/components/schemas/EventType'
        requestCount:
          type: integer
          minimum: 0
        successRate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        p50Ms:
          type:
            - integer
            - 'null'
          minimum: 0
        p50Comparison:
          $ref: '#/components/schemas/PercentileComparison'
        p95Ms:
          type:
            - integer
            - 'null'
          minimum: 0
        p95Comparison:
          $ref: '#/components/schemas/PercentileComparison'
      additionalProperties: false
    LatencySeriesPoint:
      type: object
      required:
        - bucketStart
        - bucketEnd
        - eventType
        - requestCount
        - p50Ms
        - p95Ms
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketEnd:
          type: string
          format: date-time
        eventType:
          $ref: '#/components/schemas/EventType'
        requestCount:
          type: integer
          minimum: 0
        p50Ms:
          type:
            - integer
            - 'null'
          minimum: 0
        p95Ms:
          type:
            - integer
            - 'null'
          minimum: 0
      additionalProperties: false
    SLISeriesPoint:
      type: object
      required:
        - bucketStart
        - bucketEnd
        - eventType
        - successfulPV
        - totalPV
        - successRate
      description: 单个时间桶和事件类型的实际成功率，不代表 SLA 或承诺目标
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketEnd:
          type: string
          format: date-time
        eventType:
          $ref: '#/components/schemas/EventType'
        successfulPV:
          type: integer
          minimum: 0
        totalPV:
          type: integer
          minimum: 0
        successRate:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: '`successfulPV / totalPV`；`totalPV=0` 时必须为空'
      additionalProperties: false
    PerformanceData:
      type: object
      required:
        - meta
        - metrics
        - endpoints
        - latencySeries
        - sliSeries
        - failures
      properties:
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointPerformance'
        latencySeries:
          type: array
          items:
            $ref: '#/components/schemas/LatencySeriesPoint'
        sliSeries:
          type: array
          description: 每个时间桶按四类事件稳定顺序返回；无请求桶的成功率为空
          items:
            $ref: '#/components/schemas/SLISeriesPoint'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPoint'
      additionalProperties: false
    DatabaseStatus:
      type: object
      required:
        - state
        - rowCount
        - todayLocalDate
        - todayRowCount
        - sizeBytes
        - lastSuccessfulWriteAt
      properties:
        state:
          type: string
          enum:
            - available
            - degraded
            - unavailable
        rowCount:
          type:
            - integer
            - 'null'
          minimum: 0
        todayLocalDate:
          type: string
          format: date
          description: '`Asia/Hong_Kong` 当前自然日'
        todayRowCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 香港当前自然日内的明细数量
        sizeBytes:
          type:
            - integer
            - 'null'
          minimum: 0
        lastSuccessfulWriteAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    SQLiteRuntimeStatus:
      type: object
      required:
        - version
        - journalMode
        - schemaVersion
      properties:
        version:
          type:
            - string
            - 'null'
          description: 服务端实际使用的 SQLite 运行库版本，不包含文件或构建路径
        journalMode:
          type:
            - string
            - 'null'
          enum:
            - delete
            - truncate
            - persist
            - memory
            - wal
            - 'off'
            - null
        schemaVersion:
          type:
            - string
            - 'null'
          description: 当前已应用的最高 schema migration 版本
      additionalProperties: false
    ProcessStatus:
      type: object
      required:
        - startedAt
        - uptimeMs
        - droppedSinceStart
      properties:
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 进程启动时刻；运行字段无法取得时为空
        uptimeMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 以同一次服务端生成时刻计算的进程运行毫秒数；无法取得时为空
        droppedSinceStart:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 进程启动以来丢弃的事件数；无法取得时为空
      additionalProperties: false
    PrivateListenerStatus:
      type: object
      required:
        - state
        - bindAddress
        - publicProxy
      properties:
        state:
          type:
            - string
            - 'null'
          enum:
            - starting
            - available
            - unavailable
            - stopped
            - null
          description: 私有监听器状态；运行字段无法取得时为空
        bindAddress:
          type:
            - string
            - 'null'
          pattern: ^127\.0\.0\.1:[0-9]{1,5}$
          example: 127.0.0.1:18081
          description: |
            服务实际使用的 loopback 监听地址，端口来自当前进程配置；无法取得时为空。
            这是隐私哨兵唯一允许的 IP 字面量，不是客户端或事件来源网络标识。
        publicProxy:
          type: boolean
          const: false
      additionalProperties: false
    SystemData:
      type: object
      required:
        - generatedAt
        - database
        - sqlite
        - process
        - privateListener
      properties:
        generatedAt:
          type: string
          format: date-time
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        sqlite:
          $ref: '#/components/schemas/SQLiteRuntimeStatus'
        process:
          $ref: '#/components/schemas/ProcessStatus'
        privateListener:
          $ref: '#/components/schemas/PrivateListenerStatus'
      additionalProperties: false
    AnalyticsError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ANALYTICS_INVALID_FILTER
            - ANALYTICS_INVALID_CURSOR
            - ANALYTICS_VISITOR_NOT_FOUND
            - ANALYTICS_STORAGE_UNAVAILABLE
            - ANALYTICS_QUERY_FAILED
        message:
          type: string
          minLength: 1
          description: 不含 SQL、文件路径、visitor ID 或受禁请求数据的安全说明
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - requestId
        - data
        - error
      properties:
        requestId:
          type: string
          minLength: 1
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/AnalyticsError'
      additionalProperties: false
    OverviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OverviewData'
    TrafficEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TrafficData'
    DownloadsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DownloadsData'
    EventListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelopeBase'
        - type: object
          properties:
